pre-commit:
  parallel: true
  commands:
    frontend-lint:
      glob: "frontend/**/*.{js,jsx,ts,tsx}"
      run: cd frontend && npm run lint
    backend-format:
      glob: "backend/**/*.go"
      run: test -z "$(gofmt -l backend)"
    backend-vet:
      glob: "backend/**/*.go"
      run: cd backend && go vet ./...

pre-push:
  parallel: true
  commands:
    frontend-test:
      glob: "frontend/**/*.{css,html,js,jsx,json,ts,tsx}"
      run: cd frontend && npm test
    frontend-build:
      glob: "frontend/**/*.{css,html,js,jsx,json,ts,tsx}"
      run: cd frontend && npm run build
    backend-test:
      glob: "backend/**/*.go"
      run: cd backend && go test ./...
