# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list
    silent: true

  dev:
    desc: Postgres・バックエンド・フロントエンドをまとめて起動
    cmds:
      # バックエンドはDB未接続だと起動時に落ちるため、healthyになるまで待つ。
      - task: db:up
      - task: dev:servers

  dev:servers:
    internal: true
    deps:
      - dev:backend
      - dev:frontend

  dev:backend:
    internal: true
    dir: backend
    # `backend/.env` はコンテナ実行にも使うため、ホストからComposeのPostgresへ
    # 接続する `task dev` では localhost を明示して上書きする。
    env:
      DATABASE_URL: postgres://wip:wip_password@localhost:5432/wip?sslmode=disable
      # LAN対戦のPose同期はクラウドRedisを経由させず、同じPC上のRedisで中継する。
      UPSTASH_REDIS_URL: redis://localhost:6379
    cmds:
      - go run ./cmd/server

  dev:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run dev

  db:up:
    desc: ローカル開発用のPostgresを起動（healthyになるまで待つ）
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: ローカル開発用のPostgresを停止（データは保持）
    cmds:
      - docker compose down

  db:reset:
    desc: ローカル開発用のPostgresを停止してデータを削除
    cmds:
      - docker compose down -v

  deploy:frontend:
    desc: フロントエンドをCloudflare Workersの本番へデプロイ
    dir: frontend
    cmds:
      - npm run deploy

  deploy:frontend:preview:
    desc: フロントエンドのプレビュー版をアップロード（本番トラフィックは変更しない）
    dir: frontend
    cmds:
      - npm run deploy:preview

  deploy:backend:
    desc: バックエンドをCloudflare Containersの本番へデプロイ（Docker起動が必要）
    dir: backend
    cmds:
      - npm run deploy

  dev:backend:container:
    desc: Worker＋コンテナをローカルで起動して本番構成を再現（Docker起動が必要）
    dir: backend
    cmds:
      - npm run dev

  ci:
    desc: GitHub Actions と同じ品質チェックを実行
    deps:
      - ci:frontend
      - ci:backend
      - ci:backend:worker

  ci:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm ci
      - npm run lint
      - npm run format:check
      - npm test
      - npm run build

  ci:backend:
    internal: true
    dir: backend
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...

  ci:backend:worker:
    internal: true
    dir: backend
    cmds:
      - npm ci
      # worker-configuration.d.ts はコミットしないため、型検査の前に生成する。
      - npx wrangler types
      - npm run typecheck
