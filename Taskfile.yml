# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list
    silent: true

  dev:
    desc: バックエンド（Worker）とフロントエンドを起動
    deps:
      - dev:backend
      - dev:frontend

  dev:backend:
    internal: true
    dir: backend
    # Go は Wasm にビルドして Worker 上で動くため、wrangler dev で起動する。
    # 接続先は backend/.dev.vars で指定する。connect() は localhost に到達できないため、
    # ローカルの Postgres ではなくマネージドPostgresを指定すること。
    cmds:
      - npm run dev -- --port 8787

  dev:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run dev

  db:up:
    desc: ローカル開発用のPostgresを起動（healthyになるまで待つ）
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: ローカル開発用のPostgresを停止（データは保持）
    cmds:
      - docker compose down

  db:reset:
    desc: ローカル開発用のPostgresを停止してデータを削除
    cmds:
      - docker compose down -v

  swagger:
    desc: Goのアノテーションから backend/docs のOpenAPI定義を再生成
    dir: backend
    cmds:
      # swagコマンドの未インストール環境でも動くよう go run で実行する。
      # バージョンは backend/go.mod の github.com/swaggo/swag と揃えること。
      - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/server/main.go -o docs

  generate:api:
    desc: OpenAPI定義とフロントエンドのAPI Hooksをまとめて再生成
    cmds:
      - task: swagger
      - task: generate:api:client

  generate:api:client:
    internal: true
    dir: frontend
    cmds:
      - npm run generate:api

  deploy:frontend:
    desc: フロントエンドをCloudflare Workersの本番へデプロイ
    dir: frontend
    cmds:
      - npm run deploy

  deploy:frontend:preview:
    desc: フロントエンドのプレビュー版をアップロード（本番トラフィックは変更しない）
    dir: frontend
    cmds:
      - npm run deploy:preview

  deploy:backend:
    desc: バックエンドをCloudflare Workersの本番へデプロイ
    dir: backend
    cmds:
      - npm run deploy

  db:migrate:
    desc: GORMのAutoMigrateでスキーマを適用（DATABASE_URL を指定して実行する）
    dir: backend
    cmds:
      - go run ./cmd/migrate

  ci:
    desc: GitHub Actions と同じ品質チェックを実行
    deps:
      - ci:frontend
      - ci:backend
      - ci:backend:worker

  ci:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm ci
      - npm run lint
      - npm run format:check
      - npm test
      - npm run build

  ci:backend:
    internal: true
    dir: backend
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...

  ci:backend:worker:
    internal: true
    dir: backend
    cmds:
      - npm ci
      # worker-configuration.d.ts はコミットしないため、型検査の前に生成する。
      - npx wrangler types
      - npm run typecheck
