# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list
    silent: true

  dev:
    desc: Postgres・バックエンド・フロントエンドをまとめて起動
    cmds:
      # バックエンドはDB未接続だと起動時に落ちるため、healthyになるまで待つ。
      - task: db:up
      - task: dev:servers

  dev:servers:
    internal: true
    deps:
      - dev:backend
      - dev:frontend

  dev:backend:
    internal: true
    dir: backend
    cmds:
      - go run ./cmd/server

  dev:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run dev

  db:up:
    desc: ローカル開発用のPostgresを起動（healthyになるまで待つ）
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: ローカル開発用のPostgresを停止（データは保持）
    cmds:
      - docker compose down

  db:reset:
    desc: ローカル開発用のPostgresを停止してデータを削除
    cmds:
      - docker compose down -v

  ci:
    desc: GitHub Actions と同じ品質チェックを実行
    deps:
      - ci:frontend
      - ci:backend

  ci:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm ci
      - npm run lint
      - npm run format:check
      - npm test
      - npm run build

  ci:backend:
    internal: true
    dir: backend
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...
