# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list
    silent: true

  ci:
    desc: GitHub Actions と同じ品質チェックを実行
    deps:
      - ci:frontend
      - ci:backend

  ci:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm ci
      - npm run lint
      - npm run format:check
      - npm test
      - npm run build

  ci:backend:
    internal: true
    dir: backend
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...
